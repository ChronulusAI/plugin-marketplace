name: Bump Plugin Version

# Bumps the patch version of every plugin touched by a push to main, so installed copies
# of a plugin pick up each change. The bump commit only edits the plugin manifests, which the script
# ignores (and GITHUB_TOKEN pushes don't trigger workflows), so this can't loop.
on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'

# One bump at a time, queued in order, so two quick merges can't race to push.
concurrency:
  group: bump-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump changed plugins
        id: bump
        run: |
          python3 .github/scripts/bump_plugin_versions.py \
            "${{ github.event.before }}" "${{ github.sha }}" | tee bumped.txt
          if [ -s bumped.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          rm bumped.txt

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugins/*/.claude-plugin/plugin.json plugins/*/plugin.json
          git commit -m "Bump version"
          git pull --rebase origin main
          git push origin HEAD:main
